[project]
name = "betterclasificator"
version = "0.1.0"
requires-python = ">= 3.12"
dependencies = [
    "marimo[mcp]",
    "pandas",
    "pillow",
    "altair",
    "torch",
    "torchvision",
    "transformers>=4.56",
    "timm",
    "scikit-learn",
    "mlflow[mcp]>=3.17",
    "optuna>=5.0.0",
    "anomalib>=2.6.2",
    "skl2onnx>=1.20.0",
    "onnx>=1.23.2",
    "onnxruntime>=1.30.0",
    "seaborn>=0.13.2",
    "nbformat>=5.11.1",
    "nbconvert>=7.17.1",
    "ipykernel>=7.4.0",
    "onnxscript>=0.7.2",
    "ultralytics>=8.4.176",
    "clip",
    "segment-anything>=1.0",
    "torchprofile>=0.1.0",
    "tensorrt-cu12==10.13.3.9.post1 ; python_full_version < '3.14'",
    "onnxsim>=0.8.1",
    "omegaconf>=2.3.1",
    "onnxslim>=0.1.99",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
tensorrt-cu12 = { index = "nvidia" }
tensorrt-cu12-bindings = { index = "nvidia" }
tensorrt-cu12-libs = { index = "nvidia" }
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
clip = { git = "https://github.com/ultralytics/CLIP.git" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true
